name: Build TelaVip v2.0.0 APK

on:
  push:
    paths:
      - '.github/workflows/build-apk-v2.yml'
      - 'TelaVip_v2.0.0_build_publico.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android 34
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        run: |
          mkdir buildsrc
          unzip -q TelaVip_v2.0.0_build_publico.zip -d buildsrc

      - name: Compilar APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p output/tools/lib
          cp buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk output/TelaVipSuper-v2.0.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/34.0.0/zipalign" output/tools/zipalign
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" output/tools/lib/apksigner.jar
          chmod +x output/tools/zipalign

      - name: Enviar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: telavip-v2.0.0-unsigned
          path: output/
          if-no-files-found: error
          retention-days: 1
